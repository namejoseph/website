<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Joseph Salazar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Montserrat:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #000000;
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        .code {
            font-family: 'Antonio', sans-serif;
            font-size: 6rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: #f0f0e6;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            margin: 0 0 1rem 0;
            line-height: 1;
        }

        .message {
            font-family: 'Antonio', sans-serif;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #dcdcd0;
            text-transform: uppercase;
            margin: 0 0 3rem 0;
        }

        .home-link {
            font-family: 'Antonio', sans-serif;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: #f0f0e6;
            text-transform: uppercase;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .home-link:hover {
            color: #ffffff;
            border-color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .code {
                font-size: 4rem;
            }

            .message {
                font-size: 1.1rem;
            }

            .home-link {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="code">404</h1>
        <p class="message">Page Not Found</p>
        <a href="/index.html" class="home-link">Return Home</a>
    </div>
</body>

</html>
