<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joseph Salazar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Montserrat:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #000000;
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        .name {
            font-family: 'Antonio', sans-serif;
            font-size: 4.5rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: #f0f0e6;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            margin: 0 0 1.5rem 0;
            line-height: 1.1;
        }

        .tagline {
            font-family: 'Antonio', sans-serif;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #dcdcd0;
            text-transform: uppercase;
            margin: 0 0 3rem 0;
        }

        .social {
            display: flex;
            gap: 1.75rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .social a {
            color: #f0f0e6;
            font-size: 1.6rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .social a:hover {
            color: #ffffff;
            transform: translateY(-3px) scale(1.1);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .separator {
            width: 1px;
            height: 1.5rem;
            background-color: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 600px) {
            .name {
                font-size: 2.75rem;
            }

            .tagline {
                font-size: 1.1rem;
            }

            .social {
                gap: 1.25rem;
            }

            .social a {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="name">Joseph Salazar</h1>
        <p class="tagline">New Website Coming Soon</p>
        <div class="social">
            <a href="https://youtube.com/@namejoseph" target="_blank" aria-label="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://instagram.com/namejoseph" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://fb.com/namejoseph" target="_blank" aria-label="Facebook">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="https://x.com/namejoseph" target="_blank" aria-label="X">
                <i class="fab fa-x-twitter"></i>
            </a>
            <a href="https://www.linkedin.com/in/namejoseph/" target="_blank" aria-label="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <div class="separator"></div>
            <a href="mailto:thefutureofouterspace@gmail.com" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
        </div>
    </div>
</body>

</html>
